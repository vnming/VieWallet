name: CI

on:
  push:
    branches: [main, "phase-*/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-postgres
      VW_DB_MIGRATOR_PASSWORD: ci-migrator
      VW_DB_APP_PASSWORD: ci-app
      VW_TEST_DATABASE_URL: postgresql+psycopg://viewallet_app:ci-app@127.0.0.1:5432/viewallet_test
      VW_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://viewallet_migrator:ci-migrator@127.0.0.1:5432/viewallet_test
      VW_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Create database roles and databases
        run: bash ../infra/docker/postgres/initdb/01-roles.sh
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Module boundaries (import-linter)
        run: uv run lint-imports
      - name: Tests (unit + integration) with coverage
        run: uv run pytest --cov --cov-report=term --cov-fail-under=90
      - name: OpenAPI document is up to date
        run: |
          uv run python -m app.scripts.export_openapi /tmp/openapi.json
          diff -u ../frontend/packages/api-client/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match openapi.json
        run: |
          pnpm --filter @viewallet/api-client exec openapi-typescript openapi.json -o src/schema.d.ts
          pnpm exec prettier --write packages/api-client/src/schema.d.ts
          git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          bash e2e/wait-for-stack.sh
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e
        run: pnpm test
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
