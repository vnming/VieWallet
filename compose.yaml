# VieWallet local stack.
#
#   cp .env.example .env
#   docker compose up -d --build          # full stack
#   docker compose up -d postgres redis mailpit   # infrastructure only (apps run on the host)
#
# Images run as non-root where the upstream image allows it.
name: viewallet

x-backend-env: &backend-env
  VW_ENVIRONMENT: development
  # Encrypted KYC files (simulated documents) live on their own volume, outside the DB.
  VW_KYC_STORAGE_DIR: /var/lib/viewallet/kyc
  VW_LOG_JSON: "true"
  VW_DATABASE_URL: postgresql+psycopg://viewallet_app:${VW_DB_APP_PASSWORD:?set in .env}@postgres:5432/viewallet
  VW_MIGRATION_DATABASE_URL: postgresql+psycopg://viewallet_migrator:${VW_DB_MIGRATOR_PASSWORD:?set in .env}@postgres:5432/viewallet
  VW_REDIS_URL: redis://redis:6379/0
  VW_CORS_ORIGINS: '["http://127.0.0.1:${VW_PORT_WEB:-8080}","http://127.0.0.1:${VW_PORT_ADMIN:-8081}","http://localhost:${VW_PORT_WEB:-8080}","http://localhost:${VW_PORT_ADMIN:-8081}"]'
  VW_WEB_BASE_URL: http://127.0.0.1:${VW_PORT_WEB:-8080}
  VW_ADMIN_BASE_URL: http://127.0.0.1:${VW_PORT_ADMIN:-8081}
  VW_DATA_ENCRYPTION_KEY: ${VW_DATA_ENCRYPTION_KEY:?set in .env}
  VW_PIN_PEPPER: ${VW_PIN_PEPPER:?set in .env}
  # The local stack is served over plain HTTP; production-like deployments keep the default (true).
  VW_COOKIE_SECURE: "false"
  VW_SMTP_HOST: mailpit
  VW_SMTP_PORT: "1025"
  # Payment Provider Simulator: reached inside the network; callbacks come back to the api.
  VW_SIMULATOR_URL: http://simulator:8090
  VW_SIMULATOR_API_KEY: ${VW_SIMULATOR_API_KEY:?set in .env}
  VW_SIMULATOR_WEBHOOK_SECRET: ${VW_SIMULATOR_WEBHOOK_SECRET:?set in .env}
  VW_PROVIDER_CALLBACK_BASE_URL: http://api:8000
  # 60 minutes by default; the E2E run sets 0 so a new bank account is usable at once.
  VW_NEW_DESTINATION_COOLDOWN_MINUTES: ${VW_NEW_DESTINATION_COOLDOWN_MINUTES:-60}

x-sim-env: &sim-env
  SIM_ENVIRONMENT: development
  SIM_DATABASE_URL: postgresql+psycopg://viewallet_sim:${VW_DB_SIM_PASSWORD:?set in .env}@postgres:5432/viewallet_sim
  SIM_API_KEY: ${VW_SIMULATOR_API_KEY:?set in .env}
  SIM_WEBHOOK_SECRET: ${VW_SIMULATOR_WEBHOOK_SECRET:?set in .env}
  SIM_ADMIN_KEY: ${VW_SIMULATOR_ADMIN_KEY:?set in .env}
  SIM_PUBLIC_BASE_URL: http://127.0.0.1:${VW_PORT_SIMULATOR:-8090}
  SIM_ALLOWED_RETURN_ORIGINS: '["http://127.0.0.1:${VW_PORT_WEB:-8080}","http://localhost:${VW_PORT_WEB:-8080}"]'
  SIM_PENDING_DELAY_SECONDS: ${SIM_PENDING_DELAY_SECONDS:-120}
  SIM_SLOW_RESPONSE_SECONDS: ${SIM_SLOW_RESPONSE_SECONDS:-30}
  SIM_RETURN_DELAY_SECONDS: ${SIM_RETURN_DELAY_SECONDS:-300}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      VW_DB_MIGRATOR_PASSWORD: ${VW_DB_MIGRATOR_PASSWORD:?set in .env}
      VW_DB_APP_PASSWORD: ${VW_DB_APP_PASSWORD:?set in .env}
      VW_DB_SIM_PASSWORD: ${VW_DB_SIM_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${VW_PORT_POSTGRES:-55432}:5432"
    healthcheck:
      # TCP check on purpose: the temporary server used during initdb listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d viewallet"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${VW_PORT_REDIS:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${VW_PORT_MAILPIT_UI:-8025}:8025"
      - "127.0.0.1:1025:1025"

  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  sim-migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment: *sim-env
    command: ["alembic", "-c", "sim_alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  simulator:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment: *sim-env
    command: ["uvicorn", "--factory", "sim.main:app_factory", "--host", "0.0.0.0", "--port", "8090", "--no-access-log"]
    ports:
      - "127.0.0.1:${VW_PORT_SIMULATOR:-8090}:8090"
    depends_on:
      sim-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment: *backend-env
    command: ["uvicorn", "--factory", "app.main:app_factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*", "--no-access-log"]
    volumes:
      - kycdata:/var/lib/viewallet/kyc
    ports:
      - "127.0.0.1:${VW_PORT_API:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP: web
    ports:
      - "127.0.0.1:${VW_PORT_WEB:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        APP: admin
    ports:
      - "127.0.0.1:${VW_PORT_ADMIN:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  kycdata:
